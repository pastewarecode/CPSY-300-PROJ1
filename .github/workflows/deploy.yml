name: CI/CD Pipeline (Task 4)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (Optional) quick lint/sanity checks on Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Basic sanity check
        run: |
          python - << 'PY'
          import os, sys
          assert os.path.exists("Dockerfile"), "Dockerfile missing"
          assert os.path.exists("data_analysis.py"), "data_analysis.py missing"
          assert os.path.exists("All_Diets.csv"), "All_Diets.csv missing"
          print("Sanity OK")
          PY

      - name: Build Docker image
        run: docker build -t diet-analysis:ci .

      - name: Run container (smoke test) and collect outputs
        run: |
          mkdir -p outputs
          docker run --rm \
            -v "$PWD/outputs:/app/outputs" \
            diet-analysis:ci
          ls -la outputs || true

      - name: Upload outputs as artifact (charts, CSVs, etc.)
        uses: actions/upload-artifact@v4
        with:
          name: task4-outputs
          path: outputs/**
          if-no-files-found: ignore

  push-to-dockerhub:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}  # only runs if secrets set

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (tag for Hub)
        run: |
          docker build -t diet-analysis:ci .
          docker tag diet-analysis:ci ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest
