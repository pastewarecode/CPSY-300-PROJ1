name: CI/CD Pipeline (Task 4 - Build & Run Only)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: quick sanity check to catch missing files early
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sanity check files
        run: |
          python - << 'PY'
          import os
          assert os.path.exists("Dockerfile"), "Dockerfile missing"
          assert os.path.exists("data_analysis.py"), "data_analysis.py missing"
          assert os.path.exists("All_Diets.csv"), "All_Diets.csv missing"
          print("Sanity OK")
          PY

      - name: Build Docker image
        run: docker build -t diet-analysis:ci .

      - name: Run container (smoke test) and collect outputs
        run: |
          mkdir -p outputs
          docker run --rm \
            -v "$PWD/outputs:/app/outputs" \
            diet-analysis:ci
          echo "Outputs after run:"
          ls -la outputs || true

      - name: Upload outputs as artifact (charts/CSVs/logs)
        uses: actions/upload-artifact@v4
        with:
          name: task4-outputs
          path: outputs/**
          if-no-files-found: ignore
